[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "pipespec-validator"
version = "1.0.0"
description = "Validator CLI + Python API for PipeSpec (Pipeline Specification) JSON/YAML documents."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "PipeSpec contributors" }]
keywords = ["jsonschema", "data-pipelines", "orchestration", "llm", "specification"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
  "jsonschema>=4.21.0",
  "referencing>=0.35.0",
  "pyyaml>=6.0.1",
  "typer>=0.12.0",
  "rich>=13.7.0",
]

[project.urls]
Homepage = "https://github.com/<org>/pipespec"
Repository = "https://github.com/<org>/pipespec"
Issues = "https://github.com/<org>/pipespec/issues"

[project.scripts]
pipespec-validate = "pipespec_validator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pipespec_validator"]

[tool.hatch.build]
include = [
  "src/pipespec_validator/data/pipespec_schema_v1.json",
  "src/pipespec_validator/data/pipespec_prompt_profile_v1.json",
  "LICENSE",
  "NOTICE",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.8.0",
  "types-PyYAML>=6.0.12.20241230",
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.5.0",
]

[project.optional-dependencies]
llm = ["openai>=1.0.0"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"